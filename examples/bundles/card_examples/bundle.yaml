name: card_examples
version: "0.1"
description: |
  feat-009 tutorial example bundle — not shipped (it is not part of
  the wheel and `kolsch setup` never copies it). Copy this directory
  into your workspace's `bundles/` to try it. It demonstrates the four
  v1 card kinds and the Prompts service with three tools under
  `tools/`:

  - `hello_card` — streaming markdown card.
  - `download_with_progress` — determinate progress bar.
  - `confirm_dangerous_action` — direct `Prompts.choice` with
    `PromptBusy` catch-and-retry.

  Tutorial: `docs/tutorials/write-a-card-tool.md`. These tools are
  the runnable landing page for bundle authors — copy one, edit the
  args, ship your own.
