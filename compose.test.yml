# compose.test.yml — the commit gate and CI (handbook §8.2.2, §9.2).
#
# Deliberately the opposite of compose.dev.yml: clean rebuild, source
# COPIED in (not mounted), runs the full gate.
#
# Run with:
#   podman compose -f compose.test.yml down -v
#   podman compose -f compose.test.yml build --no-cache app
#   podman compose -f compose.test.yml up \
#       --abort-on-container-exit --exit-code-from app
#
# CI runs the same flow. "Passes at commit" == "passes in CI."
#
# Phase 2 backend-swap note: a postgres + redis service pair previously
# lived here to back `test_tc_int_07_backend_swap_is_transparent` (an
# unconditionally-skipped test that probes for `store.postgres_backend`
# and `bus.redis` modules that don't ship in v1). The services and
# their env vars (AGENT_PLATFORM_TEST_POSTGRES_DSN /
# AGENT_PLATFORM_TEST_REDIS_URL) were removed to drop the per-run
# container startup cost. Restore them when the Phase 2 backends land
# (the test's skipif probe + scaffolded body remain in place).

services:
  app:
    build:
      context: .
      dockerfile: Containerfile
    image: kolsch-test:latest
    environment:
      # testcontainers + Podman compatibility (handbook §8.2.3).
      TESTCONTAINERS_RYUK_DISABLED: "true"
    working_dir: /workspace
    # The full gate, in fail-fast order (handbook §9.3):
    #   1. ruff check
    #   2. ruff format --check
    #   3. mypy
    #   4. chat-widget palette-bypass lint (qol-082) — cheap grep guard
    #      that blocks raw hex in `color:` / `background:` / `border*:`
    #      property values under `src/cli/chat/widgets/`. Widget-local
    #      `$var: #hex;` fallbacks (isolation-invariant per qol-082) are
    #      exempted by the regex's left-side guard.
    #   5. unit + component + integration tests (golden inclusive)
    #
    # E2E tests are NOT in the gate; they cost tokens and run on a
    # separate schedule.
    command:
      - sh
      - -ec
      - |
        uv run ruff check .
        uv run ruff format --check .
        uv run mypy .
        uv run python scripts/lint_chat_hex.py
        uv run pytest \
            --cov \
            --cov-report=xml \
            --cov-report=term \
            tests/unit \
            tests/component \
            tests/integration \
            tests/golden
