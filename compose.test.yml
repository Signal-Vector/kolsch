# compose.test.yml — the commit gate and CI (handbook §8.2.2, §9.2).
#
# Deliberately the opposite of compose.dev.yml: clean rebuild, source
# COPIED in (not mounted), runs the gate.
#
# Run with:
#   podman compose -f compose.test.yml down -v
#   podman compose -f compose.test.yml build --no-cache app
#   podman compose -f compose.test.yml up \
#       --abort-on-container-exit --exit-code-from app
#
# Two scopes, selected by GATE_SCOPE (qol-125):
#   full   (default) — whole tests/ tree + coverage + 85% floor. The
#                      hard local landing gate (run by scripts/commit-gate
#                      and the .githooks/pre-push hook at push-to-main).
#   sanity           — whole tree MINUS the two heavy dirs (tests/cli,
#                      tests/component), no coverage. What GitHub CI runs
#                      on every push (~3 min vs ~16 min).
# GitHub CI runs the SANITY scope, not this full flow — "passes at commit"
# no longer equals "passes in CI" (see AGENTS.md → Risks & Non-Guarantees).
#
# Phase 2 backend-swap note: a postgres + redis service pair previously
# lived here to back `test_tc_int_07_backend_swap_is_transparent` (an
# unconditionally-skipped test that probes for `store.postgres_backend`
# and `bus.redis` modules that don't ship in v1). The services and
# their env vars (AGENT_PLATFORM_TEST_POSTGRES_DSN /
# AGENT_PLATFORM_TEST_REDIS_URL) were removed to drop the per-run
# container startup cost. Restore them when the Phase 2 backends land
# (the test's skipif probe + scaffolded body remain in place).

services:
  app:
    build:
      context: .
      dockerfile: Containerfile
    image: kolsch-test:latest
    environment:
      # testcontainers + Podman compatibility (handbook §8.2.3).
      TESTCONTAINERS_RYUK_DISABLED: "true"
      # Gate scope (qol-125). Compose interpolates the HOST value here
      # (single `$` → parse-time substitution); `full` when unset. The
      # container's shell then drives the `case` in `command` off this.
      GATE_SCOPE: ${GATE_SCOPE:-full}
    working_dir: /workspace
    # The full gate, in fail-fast order (handbook §9.3):
    #   1. ruff check
    #   2. ruff format --check
    #   3. mypy
    #   4. chat-widget palette-bypass lint (qol-082) — cheap grep guard
    #      that blocks raw hex in `color:` / `background:` / `border*:`
    #      property values under `src/cli/chat/widgets/`. Widget-local
    #      `$var: #hex;` fallbacks (isolation-invariant per qol-082) are
    #      exempted by the regex's left-side guard.
    #   5. the test suite — scope selected by GATE_SCOPE (qol-125):
    #        full  : the whole non-e2e tree WITH coverage (the floor).
    #        sanity: the whole tree MINUS tests/cli + tests/component,
    #                no coverage (fast; what GitHub CI runs).
    #
    # bug-134: the `full` scope carries a hard wall-clock ceiling via
    # `pytest-timeout` so a wedged test fails loud instead of hanging
    # the gate silently for 45+ minutes (this happened once — a live
    # asyncio hang inside the ~4390-test sequential run left the
    # container "Up 45 minutes" at ~2% CPU with a byte-identical frozen
    # log; root cause not conclusively pinned to a single code bug, see
    # process/bug-134-full-gate-hang-nested-workflows.md).
    #   --timeout=300           per-TEST ceiling (resets each test); no
    #                           test in this suite legitimately runs
    #                           anywhere near 5 minutes, so this is pure
    #                           headroom over the real worst case while
    #                           still firing FAR short of "45+ minutes
    #                           with no signal".
    #   --timeout-method=signal SIGALRM-based: dumps every thread's live
    #                           stack, fails JUST the hung test (clear
    #                           node id + traceback down to the exact
    #                           blocked call), then lets the run
    #                           continue — verified live against a
    #                           deliberate `asyncio.sleep(3600)` hang,
    #                           including confirming SIGALRM correctly
    #                           interrupts a coroutine parked in
    #                           asyncio's blocking `select()`/`epoll`
    #                           call. `thread` method was considered and
    #                           rejected: its expiry path hard-kills the
    #                           whole process via `os._exit()`, which
    #                           would lose the coverage report and the
    #                           run's final summary — strictly less
    #                           diagnostic for this use case.
    #   --session-timeout=1500  belt-and-braces whole-run ceiling (25
    #                           min vs. the script's own ~16-min normal
    #                           runtime — a single point estimate, not a
    #                           measured variance series; if a genuinely
    #                           clean run starts creeping past ~20 min,
    #                           revisit this margin before assuming a
    #                           real hang). Only checked BETWEEN tests
    #                           (per pytest-timeout's own docs, it can't
    #                           by itself interrupt one still-running
    #                           test) — a secondary guard against "many
    #                           tests each individually under the
    #                           per-test ceiling but the aggregate still
    #                           runs away", not a replacement for
    #                           --timeout above.
    #
    # In the `full` scope the pytest target is the whole `tests/` tree so
    # `--cov` (source = ["src"]) measures the real, gate-enforced coverage
    # floor (fail_under = 85). Listing only a subset of tiers here silently
    # dropped `tests/cli`, `tests/workflows`, `tests/tools`, etc. from the
    # count and pinned coverage at ~64% — well under the floor.
    #
    # The `sanity` subset is expressed with `--ignore` (deny-list), NOT an
    # allowlist, so no fast dir (incl. `security`, `golden`, and the loose
    # root file) is ever silently dropped. Tradeoff: if a FUTURE dir turns
    # heavy, add it to the `--ignore` list here.
    #
    # `$$GATE_SCOPE` uses a DOUBLE `$` so compose passes the literal
    # `${GATE_SCOPE:-full}` through to the container, whose `sh` expands it
    # from its own env at RUNTIME (a single `$` would be eaten by compose's
    # parse-time interpolation, baking the scope into the image).
    #
    # E2E tests are NOT in the gate; they cost tokens and run on a
    # separate schedule. They are excluded by the `-m "not e2e"` marker
    # in `[tool.pytest.ini_options].addopts`, so passing the whole tree
    # here still deselects them (8 tests) rather than running them.
    command:
      - sh
      - -ec
      - |
        uv run ruff check .
        uv run ruff format --check .
        uv run mypy .
        uv run python scripts/lint_chat_hex.py
        case "$${GATE_SCOPE:-full}" in
          full)
            uv run pytest \
                --cov \
                --cov-report=xml \
                --cov-report=term \
                --timeout=300 \
                --timeout-method=signal \
                --session-timeout=1500 \
                tests
            ;;
          sanity)
            uv run pytest tests \
                --ignore=tests/cli \
                --ignore=tests/component
            ;;
          *)
            echo "unknown GATE_SCOPE: $${GATE_SCOPE}" >&2
            exit 2
            ;;
        esac
