# CI — runs the FAST "sanity" scope of compose.test.yml (whole tests/
# tree MINUS the two heavy dirs tests/cli + tests/component, no coverage;
# ~3 min vs ~16 min) via GATE_SCOPE=sanity (qol-125). This is NOT the
# full local landing gate: the full suite (whole tree + coverage + 85%
# floor) runs LOCALLY via scripts/commit-gate, which authors run before
# opening a PR. This job is the REQUIRED status check on `main` (ruleset
# "main protection"; keep the job name `gate (compose.test.yml)` in sync
# with it). A green check means "sanity passed," not "full gate passed"
# — see AGENTS.md → Landing a change / Risks & Non-Guarantees.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (compose.test.yml)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable Docker BuildKit
        run: |
          echo "DOCKER_BUILDKIT=1" >> "$GITHUB_ENV"
          echo "COMPOSE_DOCKER_CLI_BUILD=1" >> "$GITHUB_ENV"

      # The local docs reference podman compose; GitHub runners ship
      # Docker Compose v2. The compose file uses no Podman-specific
      # syntax, so `docker compose` runs it identically. We pin the
      # flow here so any drift between local and CI is one diff.
      - name: Drop prior state (defence in depth)
        run: docker compose -f compose.test.yml down -v

      - name: Build the test image clean
        run: docker compose -f compose.test.yml build --no-cache app

      - name: Run the gate
        env:
          GATE_SCOPE: sanity
        run: |
          docker compose -f compose.test.yml up \
            --abort-on-container-exit \
            --exit-code-from app

      - name: Collect coverage artifact
        if: always()
        run: |
          # The app container writes coverage.xml into /workspace before
          # exiting; copy it out for upload.
          container_id=$(docker compose -f compose.test.yml ps -q app || true)
          if [ -n "$container_id" ]; then
            docker cp "$container_id:/workspace/coverage.xml" ./coverage.xml || true
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: docker compose -f compose.test.yml down -v
