[project]
name = "agent-platform"
version = "0.0.0"
description = "Local-first, definition-orchestrated multi-agent workflow platform."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "TBD" }
authors = [
    { name = "Agent Platform Contributors" },
]
dependencies = [
    # Runtime deps. Kept minimal at scaffold time; modules add what they
    # need as they land. Pydantic v2 is the project-wide data-model
    # library (handbook §2.1) so it is included at the runtime layer.
    "pydantic>=2.7,<3",
    # YAML parsing for platform.yaml, bundle.yaml, agent .yaml,
    # SKILL.md frontmatter. Asset Management uses it at startup.
    "pyyaml>=6.0,<7",
]

[project.urls]
Homepage = "https://example.invalid/agent-platform"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

# The src/ layout follows AGENTS.md exactly: each subsystem is a
# top-level package under src/ (kernel/, errors/, store/, bus/, assets/,
# providers/, tools/, skills/, engine/).
[tool.hatch.build.targets.wheel]
packages = [
    "src/kernel",
    "src/errors",
    "src/schemas",
    "src/store",
    "src/bus",
    "src/assets",
    "src/providers",
    "src/tools",
    "src/skills",
    "src/engine",
]

# ---------------------------------------------------------------------------
# Dependency groups — installed via `uv sync --group <name>` (or all groups
# via `uv sync --all-groups`).
# ---------------------------------------------------------------------------
[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "types-pyyaml>=6.0",
]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "testcontainers>=4.7",
]

# ---------------------------------------------------------------------------
# ruff — strict rule set per handbook §3.2. One fast tool replacing flake8,
# isort, black, pyupgrade, and most of pylint.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [
    ".venv",
    "build",
    "dist",
    ".platform",
    ".codanna",
    ".fastembed_cache",
]

[tool.ruff.lint]
# Strict, broad rule set. Disable only what fights project conventions.
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "ANN",  # flake8-annotations (forces full type hints)
    "ASYNC",
    "S",    # flake8-bandit
    "BLE",  # blind-except
    "FBT",  # boolean-trap
    "A",    # builtins shadowing
    "COM",  # commas
    "DTZ",  # datetimes
    "EM",   # error-message
    "ISC",  # implicit-str-concat
    "ICN",  # import-conventions
    "G",    # logging-format
    "PIE",
    "T20",  # print
    "PT",   # pytest style
    "Q",    # quotes
    "RET",  # return
    "SIM",  # simplify
    "TID",  # tidy-imports
    "TCH",  # type-checking
    "ARG",  # unused-arguments
    "PTH",  # use pathlib
    "ERA",  # eradicate (no commented-out code)
    "PL",   # pylint subset
    "TRY",  # tryceratops
    "RUF",
]
ignore = [
    "COM812",  # conflicts with ruff format
    "ISC001",  # conflicts with ruff format
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # asserts are the whole point in tests
    "ANN",     # tests don't need exhaustive annotations on every helper
    "PLR2004", # magic numbers are fine in tests
    "ARG",     # pytest fixtures pass through unused args
    "PT011",   # pytest.raises(...) without match — error type is the
               # whole point of TC-ERR tests
    "N818",    # local test-only Probe classes don't need Error suffix
    "EM101",   # constructing canonical-shape errors with literals is
               # the whole point of the catalog tests
    "PT015",   # asserts with multi-part guards are fine in tests
    "PT018",   # composite asserts read better than splitting in tests
    "TRY301",  # cause-chain tests need nested raises to build chains
]
# `src/errors/` is, by definition, the errors package. Every class is a
# PlatformError subclass; the N818 "must end in Error" rule would force
# names like ToolUnauthorizedError, which diverges from the spec's
# naming convention (e.g. `ToolUnauthorized` in spec §3.2). Suppress
# locally; ambiguity is impossible inside this package.
"src/errors/**" = ["N818"]
# Pydantic v2 resolves field annotations at runtime via
# `typing.get_type_hints()`. With `from __future__ import annotations`
# in place, those imports look TYPE_CHECKING-only to ruff but must
# stay at runtime or Pydantic can't build the model schema.
"src/schemas/**" = ["TC001", "TC003"]
# Same Pydantic-at-runtime concern for the kernel's Partial* models.
"src/kernel/**" = ["TC001", "TC003"]
# Same for the assets package — Pydantic-validated catalog records
# need their type imports at runtime, not in TYPE_CHECKING.
"src/assets/**" = ["TC001", "TC003"]

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true
suppress-dummy-args = true

[tool.ruff.lint.isort]
known-first-party = [
    "kernel",
    "errors",
    "schemas",
    "store",
    "bus",
    "assets",
    "providers",
    "tools",
    "skills",
    "engine",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ---------------------------------------------------------------------------
# mypy — strict, with the Pydantic plugin (handbook §3.3).
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_decorators = true
disallow_any_generics = true
no_implicit_reexport = true
show_error_codes = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests"]
namespace_packages = true
explicit_package_bases = true
exclude = [
    "^\\.venv/",
    "^build/",
    "^dist/",
    "^\\.platform/",
]

[[tool.mypy.overrides]]
# Third-party libraries without type stubs land here as they get adopted.
# Add ignores explicitly so the scope of "untyped" stays visible.
module = ["testcontainers.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# pytest — async mode + coverage (handbook §3.4).
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: pure logic, no I/O",
    "component: one subsystem against real backing",
    "integration: multiple subsystems + Fake LLM + real CrewAI",
    "e2e: whole platform, real infrastructure, real LLM",
    "golden: golden event-sequence comparison",
    "slow: long-running tests",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pydantic._internal.*",
]

# ---------------------------------------------------------------------------
# coverage — targets per handbook §11. Source spans every src/ subsystem.
# ---------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
# Coverage ratchet — handbook §11.1 floor is 85%. The current
# suite sits at ~90%; setting `fail_under = 85` makes a substantial
# drop fail CI while leaving headroom for normal noise. Bump this
# value UP as coverage grows; the per-PR delta check
# (handbook §11.2) is a CI responsibility (codecov / coverallsapp /
# similar diff against the main branch). Bumping ahead of Step 8
# locks the current baseline before the engine + golden tests bring
# hundreds of new lines.
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
