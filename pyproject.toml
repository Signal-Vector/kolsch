[project]
name = "kolsch"
version = "0.0.0"
description = "Local-first, definition-orchestrated multi-agent workflow platform."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "TBD" }
authors = [
    { name = "Agent Platform Contributors" },
]
dependencies = [
    # Runtime deps. Kept minimal at scaffold time; modules add what they
    # need as they land. Pydantic v2 is the project-wide data-model
    # library (handbook §2.1) so it is included at the runtime layer.
    "pydantic>=2.7,<3",
    # YAML parsing for platform.yaml, bundle.yaml, agent .yaml,
    # SKILL.md frontmatter. Asset Management uses it at startup.
    # Phase 3.0 Step 0 migrated off PyYAML to ruamel.yaml — fixes
    # the Norway-bug (PyYAML coerced unquoted ``no``/``yes``/``on``/
    # ``off`` to booleans) and unlocks line-info-aware loading needed
    # by the workflow parser. The single chokepoint is ``src/_yamlio.py``
    # (named ``_yamlio`` rather than ``_yaml`` to avoid colliding with
    # PyYAML's site-packages compatibility stub package ``_yaml/`` —
    # PyYAML remains a transitive dep of crewai et al.); every other
    # module imports ``load`` / ``dump`` from there.
    # ``ruamel.yaml.clib`` is the optional C extension that ruamel
    # falls back to a pure-Python parser without.
    "ruamel.yaml>=0.18,<1",
    "ruamel.yaml.clib>=0.2.8",
    # Step 13 — CLI + API entry surfaces. FastAPI for the HTTP surface;
    # uvicorn as the production ASGI server. No CrewAI / litellm here —
    # the engine's runtime is still framework-agnostic.
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    # Phase 1.2 (UX-R1) — workspace resolution. `platformdirs` provides
    # the canonical per-OS user-documents path that
    # `platform_runtime.workspace.resolve_workspace` uses as the default
    # when neither `--root` nor `$KOLSCH_WORKSPACE` is set.
    "platformdirs>=4.2",
    # Phase 2.1 (Step 24a) — `kolsch chat` REPL. `prompt_toolkit` powers
    # the multi-line input loop with the patch §2.5 key-binding table
    # (Enter submits, Ctrl-J / Alt-Enter / Shift-Enter insert newline);
    # `rich` will render the streaming agent block + tool-call panels
    # in later steps (24c+). Both are pinned to versions known to
    # compose without the prompt_toolkit-vs-rich quirks documented in
    # Part 11 item 1.
    "prompt_toolkit>=3.0.43,<4",
    "rich>=13.7.1,<15",
    # Phase 2.2 (ENV-R13) — Jinja2 templating for agent prompts.
    # `>= 3.1.0` is required for the native `{% block X required %}`
    # syntax used by agent inheritance (Phase 2.2 §8.4). Used by
    # `src/templating/render.py` and the prompt pre-flight in
    # `src/engine/engine.py` (steps 5.6.5 + 5.6.6).
    "jinja2>=3.1.0,<4",
]

[project.urls]
Homepage = "https://example.invalid/kolsch"

# Console script — `kolsch` dispatches to src/cli/__init__.py:main.
[project.scripts]
kolsch = "cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

# The src/ layout follows AGENTS.md exactly: each subsystem is a
# top-level package under src/ (kernel/, errors/, store/, bus/, assets/,
# providers/, tools/, skills/, engine/).
#
# `src/kolsch` (Phase 2.2, ENV-R13) is an umbrella package whose
# only purpose is to host repo-root documentation as package data.
# The `kolsch:` prefix in agent `context_files` / `extends:` resolves
# via `importlib.resources.files("kolsch") / <rel>` and reads the
# files force-included below. Source-tree dev finds them via the
# empty package + force-include; installed contexts find them via
# package-data lookup.
#
# `src/templating` (Phase 2.2) houses the Jinja render harness, the
# five variable objects, and `context_files` / `extends:`
# resolution.
[tool.hatch.build.targets.wheel]
packages = [
    "src/kernel",
    "src/errors",
    "src/schemas",
    "src/store",
    "src/bus",
    "src/assets",
    "src/providers",
    "src/tools",
    "src/skills",
    "src/engine",
    "src/files",
    "src/cli",
    "src/api",
    "src/platform_runtime",
    "src/llm",
    "src/templating",
    "src/kolsch",
]

# Phase 2.2 (ENV-R13 / E-2.2-001 A3) — repo-root docs ship as
# package data inside the `kolsch` umbrella so
# `importlib.resources.files("kolsch") / "docs/index.md"` (etc.)
# finds the file in any installed wheel. Verify with:
#     uv build && unzip -l dist/kolsch-*.whl | grep kolsch/docs/
#
# IMPORTANT: this force-include applies to the wheel target only.
# Editable installs (`uv sync`, `pip install -e .`) ship the source
# tree directly via a .pth file; `importlib.resources.files("kolsch")`
# resolves to `src/kolsch/` on disk, which does NOT contain the
# force-included files. The Phase 2.2 Step 12 `context_files`
# loader is responsible for the source-tree-vs-installed dispatch
# (its reviewer prompt covers BOTH contexts). Most likely
# implementation: probe `importlib.resources` first; if the resource
# is missing AND the runtime is a source-tree install, fall back to
# the repo-root-relative path resolved via the `kolsch` package's
# `__file__` parent's parent.
[tool.hatch.build.targets.wheel.force-include]
"docs" = "src/kolsch/docs"
"AGENTS.md" = "src/kolsch/AGENTS.md"
# Phase 3.0 Step 0 — the ruamel.yaml chokepoint lives as a single
# module at the src root; force-include keeps it discoverable in
# installed wheels (the editable install already finds it via the
# src/ .pth entry). Named ``_yamlio`` (not ``_yaml``) to avoid
# colliding with PyYAML's site-packages compatibility stub package
# ``_yaml/`` — PyYAML stays as a transitive dep of crewai et al.
"src/_yamlio.py" = "_yamlio.py"

# ---------------------------------------------------------------------------
# Dependency groups — installed via `uv sync --group <name>` (or all groups
# via `uv sync --all-groups`).
# ---------------------------------------------------------------------------
[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    # Parallel test execution — required to keep the CLI smoke suite
    # (tests/component/test_cli_smoke.py) under the
    # bug-sessions-namespace-attr-error.md AC 5 <10s target. Each smoke
    # test spawns a fresh Python subprocess (~1s Python import floor ×
    # N tests = ~30s+ serial). With `-n auto`, xdist drops this to
    # roughly the per-test floor on a multi-core box. The smoke suite's
    # session-scoped `initialized_workspace` fixture runs once per
    # worker; each worker gets its own tmp_path so parallel readers /
    # no-op writers don't contend.
    "pytest-xdist>=3.5,<4",
    "testcontainers>=4.7",
    # FastAPI's TestClient is starlette.testclient.TestClient, which
    # tries `import httpx2 as httpx` first (starlette deprecated
    # httpx in favour of httpx2; see
    # .venv/lib/python3.13/site-packages/starlette/testclient.py:43).
    # Without httpx2 installed, the import path raises a
    # StarletteDeprecationWarning that promotes to an error under our
    # filterwarnings setup. httpx2 is a real, maintained package
    # (PyPI: httpx2==2.2.0 as of 2026-05); pin it explicitly so the
    # test path doesn't fall back to the legacy httpx import.
    "httpx2>=2.2,<3",
    # CrewAI for the v1 production Framework adapter. Test-group only —
    # the engine's contract (src/engine/framework.py) stays
    # framework-agnostic per the prereq design note. Pinned to a
    # specific version because (a) CrewAI iterates rapidly and breaks
    # APIs (e.g. function_calling_llm deprecated in 1.14.5a6) and (b)
    # the prereq spike was validated against this exact version. Bump
    # alongside a fresh validation pass against
    # docs/explanation/framework-protocol-design.md §2.
    # Release notes: https://github.com/crewAIInc/crewAI/releases
    "crewai==1.14.6",
]

# ---------------------------------------------------------------------------
# ruff — strict rule set per handbook §3.2. One fast tool replacing flake8,
# isort, black, pyupgrade, and most of pylint.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [
    ".venv",
    "build",
    "dist",
    ".platform",
    ".codanna",
    ".fastembed_cache",
]

[tool.ruff.lint]
# Strict, broad rule set. Disable only what fights project conventions.
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "ANN",  # flake8-annotations (forces full type hints)
    "ASYNC",
    "S",    # flake8-bandit
    "BLE",  # blind-except
    "FBT",  # boolean-trap
    "A",    # builtins shadowing
    "COM",  # commas
    "DTZ",  # datetimes
    "EM",   # error-message
    "ISC",  # implicit-str-concat
    "ICN",  # import-conventions
    "G",    # logging-format
    "PIE",
    "T20",  # print
    "PT",   # pytest style
    "Q",    # quotes
    "RET",  # return
    "SIM",  # simplify
    "TID",  # tidy-imports
    "TCH",  # type-checking
    "ARG",  # unused-arguments
    "PTH",  # use pathlib
    "ERA",  # eradicate (no commented-out code)
    "PL",   # pylint subset
    "TRY",  # tryceratops
    "RUF",
]
ignore = [
    "COM812",  # conflicts with ruff format
    "ISC001",  # conflicts with ruff format
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # asserts are the whole point in tests
    "ANN",     # tests don't need exhaustive annotations on every helper
    "PLR2004", # magic numbers are fine in tests
    "ARG",     # pytest fixtures pass through unused args
    "PT011",   # pytest.raises(...) without match — error type is the
               # whole point of TC-ERR tests
    "N818",    # local test-only Probe classes don't need Error suffix
    "EM101",   # constructing canonical-shape errors with literals is
               # the whole point of the catalog tests
    "PT015",   # asserts with multi-part guards are fine in tests
    "PT018",   # composite asserts read better than splitting in tests
    "TRY301",  # cause-chain tests need nested raises to build chains
    "PLR0915", # E2E real-LLM tests deliberately exercise all 3 task
               # shapes in one body so the assertion flow reads
               # top-to-bottom; splitting would obscure the gating
               # check
    "S603",    # subprocess.run with fully-controlled arg list (TC-E2E-04
               # spawns a known venv binary; not untrusted input)
    "S607",    # same — `uv` is found via PATH on the gate runner; the
               # alternative (hardcoded path) is more brittle
    "PLC0415", # E2E tests import heavy deps (crewai.llm) lazily inside
               # the test body so a `pytest --collect-only` doesn't pay
               # the import cost or fail without the e2e environment
    "SLF001",  # E2E tests reach into engine._llm / engine._tools as
               # test seams to override the LLM mid-test
    "S105",    # Phase 1.1 LLM tests use literal secret-name strings
               # ("MISSING_KEY", "OPENCODE_API_KEY") in assertions —
               # these are names, not values; the secret detector
               # flags them anyway. False positive in test fixtures.
    "S106",    # Same — keyword args like `api_key_secret="OPENCODE_API_KEY"`
               # are secret NAMES, not the values.
    "S107",    # Same — default arg values in helper factories.
    "PLR0913", # Test helper factories naturally take many kwargs to
               # build varied ProviderConfig / SecretsProvider shapes.
    "E501",    # Long test names + parametrized table rows occasionally
               # exceed 88 cols; the docs/process catalog test names
               # are deliberate.
]
# `src/errors/` is, by definition, the errors package. Every class is a
# PlatformError subclass; the N818 "must end in Error" rule would force
# names like ToolUnauthorizedError, which diverges from the spec's
# naming convention (e.g. `ToolUnauthorized` in spec §3.2). Suppress
# locally; ambiguity is impossible inside this package.
"src/errors/**" = ["N818"]
# `src/workflows/errors.py` is the workflows-package error hierarchy;
# same rationale as src/errors/ — class names follow master spec
# §12.1's catalog (WorkflowDuplicateNode, etc.) rather than the
# generic "must end in Error" convention. PLR0913 because each
# class lists all of file/line/identifiers as kwargs.
"src/workflows/errors.py" = ["N818", "PLR0913"]
# `src/workflows/context.py` — NodeContext.for_test deliberately
# takes 7 keyword-only fields (master spec §5.5 + Round 7 A7-1).
"src/workflows/context.py" = ["PLR0913"]
# `src/workflows/jinja_env.py` — Pydantic-style at-runtime imports
# (TC003 false positive) + the sandbox env subclasses jinja2 internals.
"src/workflows/**" = ["TC001", "TC003"]
# Pydantic v2 resolves field annotations at runtime via
# `typing.get_type_hints()`. With `from __future__ import annotations`
# in place, those imports look TYPE_CHECKING-only to ruff but must
# stay at runtime or Pydantic can't build the model schema.
"src/schemas/**" = ["TC001", "TC003"]
# Same Pydantic-at-runtime concern for the kernel's Partial* models.
"src/kernel/**" = ["TC001", "TC003"]
# Same for the assets package — Pydantic-validated catalog records
# need their type imports at runtime, not in TYPE_CHECKING.
"src/assets/**" = ["TC001", "TC003"]
# Same for the files package — PathPolicy is a Pydantic model.
"src/files/**" = ["TC001", "TC003"]
# Same for tools — ToolContext is Pydantic; the @tool decorator's
# signature matches spec §2.2 directly (5 kwargs + the function it
# decorates), and validator branching mirrors spec §3.4's checklist.
"src/tools/**" = ["TC001", "TC003", "PLR0913", "PLR0912"]
# Same for skills — EnabledSkill and SkillInvocation are Pydantic
# models per Module API Reference §10.2.
"src/skills/**" = ["TC001", "TC003"]
# CLI module — entry-point script doesn't need ANN coverage on
# argparse handlers; argparse Namespace attribute access trips
# inferred-Any checks.
"src/cli/**" = ["TC001", "TC003"]
# API module — FastAPI routes accept Pydantic models via dependency
# injection; type-checking blocks would break Pydantic field
# inspection. Plus FBT for FastAPI's Query(default=False) idiom is
# spurious — Query is a value, not a boolean trap. PLR0915 raised
# because register_routes deliberately co-locates all route handlers
# in one function so the FastAPI app's routing table is visible top
# to bottom (vs. scattered across modules).
"src/api/**" = ["TC001", "TC003", "FBT001", "FBT002", "PLR0915"]
# Platform runtime — Framework is a Protocol kwarg whose runtime
# value never needs TYPE_CHECKING gating because it goes into the
# AgentEngine constructor immediately.
"src/platform_runtime/**" = ["TC001", "TC003"]
# Same for engine — value-type Pydantic models (LLMRequest, Message,
# AssembledContext, etc.) need their type imports at runtime. PLR0913
# is suppressed because AgentEngine.__init__ takes one keyword per
# subsystem (matrix in Module API Reference §12). PLR0912/PLR0915
# loosened for _Exchange.run/_preflight: the 9 pre-flight steps land
# in one orchestrator on purpose so the ordering is obvious from
# reading top-to-bottom.
"src/engine/**" = [
    "TC001",
    "TC003",
    "PLR0913",
    "PLR0912",
    "PLR0915",
    "PLR0911",  # _run_exchange has multiple exit points by design
    "SLF001",  # observers reach into ToolsSubsystem._registry to wrap defns
    # ANN401 — Any is the contract here: ToolHandle.__call__ returns
    # whatever the underlying tool produced (no narrower type exists
    # at the Protocol layer), and the Tools subsystem instance is
    # typed via a forward reference inside TYPE_CHECKING.
    "ANN401",
]

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true
suppress-dummy-args = true

[tool.ruff.lint.isort]
known-first-party = [
    "kernel",
    "errors",
    "schemas",
    "store",
    "bus",
    "assets",
    "providers",
    "tools",
    "skills",
    "engine",
    "files",
    "cli",
    "api",
    "platform_runtime",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ---------------------------------------------------------------------------
# mypy — strict, with the Pydantic plugin (handbook §3.3).
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_decorators = true
disallow_any_generics = true
no_implicit_reexport = true
show_error_codes = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests"]
namespace_packages = true
explicit_package_bases = true
exclude = [
    "^\\.venv/",
    "^build/",
    "^dist/",
    "^\\.platform/",
]

[[tool.mypy.overrides]]
# Third-party libraries without type stubs land here as they get adopted.
# Add ignores explicitly so the scope of "untyped" stays visible.
module = ["testcontainers.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# pytest — async mode + coverage (handbook §3.4).
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov",
    "--cov-report=term-missing",
    "--cov-report=xml",
    # Exclude E2E tests from the default `pytest` run — they cost
    # tokens, need real LLM keys, and run on a separate (nightly /
    # pre-release) schedule per + compose.test.yml.
    # Run explicitly via `pytest -m e2e` (which OVERRIDES this).
    "-m",
    "not e2e",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: pure logic, no I/O",
    "component: one subsystem against real backing",
    "integration: multiple subsystems + Fake LLM + real CrewAI",
    "e2e: whole platform, real infrastructure, real LLM",
    "golden: golden event-sequence comparison",
    "slow: long-running tests",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pydantic._internal.*",
    # SqliteBackend connections used in tests don't always reach an
    # explicit close() — the test process exit handles them. Promoting
    # to error makes unrelated tests flaky when a connection from a
    # previous test gets gc'd mid-run. The leak is bounded (lifetime
    # of one pytest process) and CI runs a fresh interpreter.
    "ignore::ResourceWarning:sqlite3",
    "ignore::ResourceWarning",
    # CrewAI's transitive imports (crewai.rag.embeddings, chromadb,
    # litellm) emit ImportWarnings and DeprecationWarnings on import.
    # Scoped here so they don't promote to errors during integration
    # tests. Our own modules still escalate any warning to error.
    "ignore::ImportWarning",
    "ignore::DeprecationWarning:crewai.*",
    "ignore::DeprecationWarning:litellm.*",
    "ignore::DeprecationWarning:chromadb.*",
    "ignore::DeprecationWarning:pkg_resources.*",
    "ignore::UserWarning:crewai.*",
    "ignore::UserWarning:litellm.*",
    "ignore::PendingDeprecationWarning:crewai.*",
]

# ---------------------------------------------------------------------------
# coverage — targets per handbook §11. Source spans every src/ subsystem.
# ---------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
# Coverage ratchet — handbook §11.1 floor is 85%. The current
# suite sits at ~90%; setting `fail_under = 85` makes a substantial
# drop fail CI while leaving headroom for normal noise. Bump this
# value UP as coverage grows; the per-PR delta check
# (handbook §11.2) is a CI responsibility (codecov / coverallsapp /
# similar diff against the main branch). Bumping ahead of Step 8
# locks the current baseline before the engine + golden tests bring
# hundreds of new lines.
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
