schema_version: "0.1"
assembly_version: "1"
agent_id: ag_urgent_responder
name: urgent_responder
description: |
  Starter agent — fires on the urgent arm of the
  ``kolsch/workflows/triage-tickets`` walkthrough. Single-shot so
  the branch dispatch consumes a typed ``{text: ...}`` reply.

io:
  mode: single_shot
  inputs: {}
  outputs:
    text:
      type: str

prompt: |
  An urgent ticket just landed. Write a brief one-sentence
  acknowledgement promising same-day attention. No preamble.
