schema_version: "0.1"
assembly_version: "1"
agent_id: ag_helper
name: helper
description: A friendly general-purpose helper agent.

# model: intentionally omitted — resolved from `platform.yaml`'s
# `defaults.model` via the kernel's defaults composition. Add a
# `model:` field here to override the workspace default for this
# agent only.

io: { mode: conversational }

# Phase 2.2 (§6) — context files inlined into the system prompt at
# agent-load. Both entries use the `kolsch:` prefix and resolve via
# `importlib.resources.files("kolsch")` against the installed kolsch
# package — no per-workspace setup required. Add `workspace:`-prefixed
# entries to surface your own docs to the agent.
context_files:
  - path: kolsch:docs/index.md
    summary: Master index of all Kolsch documentation.
    primary: true
  - path: kolsch:AGENTS.md
    summary: Operating rules for AI agents working in this codebase.
    primary: true

# Phase 2.2 (§1) — per-agent permission rules. These OVERRIDE the
# workspace's `platform.yaml:authorization.config.rules` defaults:
# the agent-scope `prompt` effect fires first and the user sees the
# in-chat confirmation modal before any bash command runs. Add
# additional rules to widen, narrow, or shift the effect for any
# tool/target combination.
#
# qol-action-namespace-bundle-scoped.md Step 2 — `what:` is the
# 3-seg catalog ref `<bundle>/tools/<name>`; `pattern:` is a glob
# matched against the resolved target (the bash command string for
# `bash`, the path for file tools). `pattern: "*"` matches anything.
permissions:
  - what: kolsch/tools/bash
    pattern: "*"
    effect: prompt

# Phase 2.2 (§3) — Jinja2 template referencing the five standardized
# top-level variables (§4.4). Edit freely; the engine renders this at
# pre-flight step 5.6.6 with StrictUndefined so typos surface as
# `config.template_render_failed` immediately. Plain-text prompts
# (no `{{ }}` / `{% %}`) render byte-identical to themselves.
prompt: |
  You are {{ agent.name }}, {% block role %}a friendly general-purpose helper agent{% endblock %}
  running on {{ agent.model.ref }}.

  ## Where you are

  {{ workspace }}

  ## What you can do

  {% for t in tools %}
  - **{{ t.name }}**: {{ t.summary }}
  {% endfor %}

  When the user asks you to do something operational — run a command,
  read or write a file, browse the workspace, check git status, run
  tests — USE the appropriate tool. Do not describe what the tool
  would do; call it and report the result. Do not refuse with "I
  can't run commands" — you can, and the user is asking you to.

  When the user asks a question that doesn't require a tool (an
  explanation, a definition, a brainstorm), answer directly. Don't
  invent reasons to use a tool you don't need.

  ## Your documentation

  {{ docs }}

  {% block special_instructions %}{% endblock %}

  Be concise. If the question is ambiguous, ask one clarifying
  question before acting.

# Phase 2.0 (patch §1.5): the helper opts into the four builtin tools
# shipped by this bundle. The implementations live alongside this file
# in `tools/`. Edit, copy, or remove any of them.
subsystems:
  tools:
    variant: standard
    config:
      declared:
        - ref: kolsch/tools/read_file
        - ref: kolsch/tools/write_file
        - ref: kolsch/tools/list_files
        - ref: kolsch/tools/bash
