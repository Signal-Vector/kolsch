schema_version: "0.1"
assembly_version: "1"
agent_id: ag_helper
name: helper
description: A friendly general-purpose helper agent.

# model: intentionally omitted — resolved from `platform.yaml`'s
# `defaults.model` via the kernel's defaults composition. Add a
# `model:` field here to override the workspace default for this
# agent only.

io: { mode: conversational }

# Context files inlined into the system prompt at agent-load. Both
# entries use the `kolsch:` prefix and resolve via
# `importlib.resources.files("kolsch")` against the installed kolsch
# package — no per-workspace setup required. Add
# `workspace:`-prefixed entries to surface your own docs to the
# agent.
context_files:
  - path: kolsch:docs/index.md
    summary: Master index of all Kolsch documentation.
    primary: true
  - path: kolsch:AGENTS.md
    summary: Operating rules for AI agents working in this codebase.
    primary: true

# Per-agent permission rules. These OVERRIDE the workspace's
# `platform.yaml:authorization.config.rules` defaults: the
# agent-scope `prompt` effect fires first and the user sees the
# in-chat confirmation modal before any bash command runs. Add
# additional rules to widen, narrow, or shift the effect for any
# tool/target combination.
#
# `what:` is the 3-seg catalog ref `<bundle>/tools/<name>`;
# `pattern:` is a glob matched against the resolved target (the bash
# command string for `bash`, the path for file tools). `pattern:
# "*"` matches anything.
permissions:
  - what: kolsch/tools/bash
    pattern: "*"
    effect: prompt

# Jinja2 template referencing the six standardized top-level
# variables (`agent`, `tools`, `docs`, `skills`, `workspace`,
# `platform`). Edit freely; the engine renders this during the
# pre-flight stage with StrictUndefined so typos surface as
# `config.template_render_failed` immediately. Plain-text prompts
# (no `{{ }}` / `{% %}`) render byte-identical to themselves.
prompt: |
  You are {{ agent.name }}, {% block role %}a friendly general-purpose helper agent{% endblock %}
  running on {{ agent.model.ref }}.

  ## Where you are

  {{ workspace }}

  ## What you can do

  {% for t in tools %}
  - **{{ t.name }}**: {{ t.summary }}
  {% endfor %}
  {% if skills.count %}

  ## Available skills

  {% for s in skills %}
  - **{{ s.name }}** — {{ s.description }}
  {% endfor %}
  {% endif %}

  When the user asks you to do something operational — run a command,
  read or write a file, browse the workspace, check git status, run
  tests — USE the appropriate tool. Do not describe what the tool
  would do; call it and report the result. Do not refuse with "I
  can't run commands" — you can, and the user is asking you to.

  When the user asks a question that doesn't require a tool (an
  explanation, a definition, a brainstorm), answer directly. Don't
  invent reasons to use a tool you don't need.

  ## Your documentation

  {{ docs }}

  {% block special_instructions %}
  ## Workflow tool prose rule

  When you call `run_workflow` (or any `run_workflow_*` virtual), it
  will BLOCK until the workflow reaches a terminal phase and return
  `{run_id, phase, outputs, error_message, _chat_anchor}`. Narrate
  the outputs concisely to the user in prose after the tool returns.
  Do NOT emit interim status prose while the tool is pending — the
  `WorkflowCard` covers that. If the tool returns with
  `phase="running"` (timeout), tell the user the workflow is still
  running and offer to check `workflow_status` later.
  {% endblock %}

  Be concise. If the question is ambiguous, ask one clarifying
  question before acting.

# The helper opts into the four builtin tools shipped by this
# bundle. The implementations live alongside this file in `tools/`.
# Edit, copy, or remove any of them.
subsystems:
  tools:
    variant: standard
    config:
      declared:
        - ref: kolsch/tools/read_file
        - ref: kolsch/tools/write_file
        - ref: kolsch/tools/list_files
        - ref: kolsch/tools/bash
        # bug-024: workflow-service tools so the model can invoke
        # workflows through the chat card surface instead of falling
        # back to `bash kolsch workflows run …` (which streams stdout
        # to a bash tool-call block instead of mounting a WorkflowCard).
        - ref: kolsch/tools/run_workflow
        - ref: kolsch/tools/workflow_status
        - ref: kolsch/tools/cancel_workflow
        # bug-027: introspection tool — model can ask "what inputs
        # does workflow X need?" before calling `run_workflow`.
        # Read-only; safe to allow by default.
        - ref: kolsch/tools/workflow_inspect
