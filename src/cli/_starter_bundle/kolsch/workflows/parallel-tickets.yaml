# Starter workflow — map over a list with an agent worker.
#
# A two-node fan-out: the ``classify_all`` map dispatches the
# ``kolsch/agents/classifier`` agent once per ticket text in the
# input list; ``count_urgent`` aggregates the results via a Jinja
# expression (``| selectattr | list | length``) — the canonical
# compute recipe that subsumes the reserved aggregation node types.
#
# Run it with:
#
#   kolsch workflows run kolsch/workflows/parallel-tickets \
#       --input 'tickets=["server down urgent","add a button","fix login urgent"]'
#
# The classifier echoes the input as its ``text`` field (the fake LLM
# provider's behavior). Operators wanting real classification swap
# the model in ``platform.yaml``'s ``defaults.model``.
description: "Map over tickets, classify each via an agent, count urgent."

nodes:
  classify_one:
    type: kolsch/nodes/agent
    agent: kolsch/agents/classifier
    description: "Worker node — fired once per ticket by the map below."
  classify_all:
    type: kolsch/nodes/map
    apply: classify_one
    over: "{{ inputs.tickets }}"
    item_as: ticket_text
    description: "Sequential fan-out — invokes classify_one per ticket."
  count_urgent:
    type: kolsch/nodes/compute
    value: >-
      {{
        nodes.classify_all.results
        | selectattr('text', 'eq', 'urgent')
        | list
        | length
      }}
    description: "Aggregate — count results whose classifier output was 'urgent'."

graph:
  edges:
    - from: classify_all
      to: count_urgent
