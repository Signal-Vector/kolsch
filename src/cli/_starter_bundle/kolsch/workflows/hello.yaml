# Starter workflow — minimal end-to-end smoke test.
#
# A two-node linear pipeline that runs end-to-end on a fresh
# ``kolsch setup --non-interactive`` workspace without any authz
# prompts. Demonstrates: workflow inputs → edge bind rendering →
# authored Python ``@node`` dispatch.
#
# - ``ready``: a built-in ``noop`` root node that fires immediately
#   so the graph has a starting frame.
# - ``greet``: an authored-Python ``@node`` (``kolsch/nodes/echo``,
#   shipped in the starter bundle at ``nodes/echo.py``). The edge
#   from ``ready`` carries ``binds: { message: ... }`` referencing
#   the workflow input.
#
# Author note: bash workflows execute too (see component tests), but
# the starter ``platform.yaml`` maps ``kolsch/bash`` to ``prompt``,
# which collapses to ``deny`` on the headless ``kolsch workflows
# run`` surface. The bash demo will return once the workflow layer
# wires the workflow's ``policy:`` field through the tool dispatcher
# (tracked separately).
description: "Starter workflow — workflow input piped to an authored @node."

nodes:
  ready:
    type: kolsch/nodes/noop
    description: "structural root node — fires immediately"
  greet:
    type: kolsch/nodes/echo
    description: "authored python node — echoes the workflow input"

graph:
  edges:
    - from: ready
      to: greet
      binds:
        message: "{{ inputs.message | default('Hello, world!') }}"
