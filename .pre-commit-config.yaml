# Pre-commit hooks — handbook §3.5 + §4.
#
# Runs ruff + mypy on staged files before each commit. Install with:
#   uv run pre-commit install
#
# The handbook also mandates the *commit gate*: a clean rebuild + full
# suite via compose.test.yml (handbook §9.2). That gate is heavier and
# is invoked by the local `scripts/commit-gate` wrapper or directly via
# `podman compose -f compose.test.yml ...`; pre-commit handles the
# lightweight per-file checks so feedback stays fast.

repos:
  # Keep in sync with the ruff version pinned by uv.lock (the CI
  # gate runs `uv run ruff` from the same environment). Drift here
  # means contributors get different findings pre-commit vs CI.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.15
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: no-spec-citations
        name: No spec citations in src/
        entry: bash -c '! grep -rn --include="*.py" "§" src/'
        language: system
        pass_filenames: false
        description: |
          The § character is reserved for spec citations, which are
          banned in src/ .py files by
          docs/process/documentation-conventions.md. Link to
          docs/explanation/*.md or docs/reference/*.md by markdown path
          instead — those survive renumbering. Restricted to .py files
          so stale __pycache__/*.pyc bytecode doesn't trip the hook.

  # mypy runs in the PROJECT environment via `uv run`, NOT the
  # mirrors-mypy isolated venv. That isolated env only installed
  # `pydantic`, so it could not resolve first-/third-party imports
  # (tiktoken, crewai, textual, pytest, uvicorn, ...) and emitted
  # hundreds of false `import-not-found` errors on every run. `uv run`
  # uses the same interpreter + uv.lock-pinned dependencies as the CI
  # gate, so pre-commit and CI agree on findings and the mypy version
  # tracks uv.lock instead of a separately-pinned mirror rev.
  #
  # `pass_filenames: false` → mypy type-checks the whole
  # `files = ["src", "tests"]` set declared in pyproject.toml. mypy is a
  # whole-program analyser; passing only the staged files misses
  # cross-file breakage (a staged change to A that breaks B) and can
  # mis-resolve packages. The `files:` regex below only decides WHETHER
  # to run — a commit that touches no `src/`|`tests/` `.py` skips mypy.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (project env, whole-tree)
        entry: uv run mypy --config-file=pyproject.toml
        language: system
        files: ^(src|tests)/.*\.py$
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: ["--fix=lf"]
